  <style>
/* default 
   html{ font-size: 10px; } clamp */
   html{ font-size:16px; } 

      /* Base */
    html,body{height:100%;}
    body{
      background: var(--bg);
      color: var(--text);
      font-family:var(--base-font);
    /*  background-color:var(--gray-950);
      color:var(--slate-100); */
      min-height:100vh;
      padding-bottom:3rem;
      transition: background-color .3s, color .3s;

      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    header{
      background: var(--bg);
      color: var(--header-color);
      border-bottom:1px solid #1f2937; 
      backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);

#headerDate {
  color: var(--header-Date-text); 
  font-size:1.3em;
  font-weight:700;
}
#headerTime {
  color: var(--header-Time-text);
  font-size:1.6em;
  font-weight:800;
}

    :root{
  --header-color: var(--gray-700);
  --header-Date-text: var(--emerald-600); /*#FF3131; /*--neon-red;*/
  --header-Time-text: var(--amber-400); /*#00F9FF; /*--neon-blue;*/
  --header-bg: var(--white); /* #F0FFFF; /*light sky blue*/
  --bg: #f9fbff; /*極淡的天藍色系白*/
  --card: rgba(255, 255, 255, 0.99); /* 90% 不透明度的純白色*/
  --card-solid: #ffffff; /* white */
  --text: #1f2937; /* 極深藍灰色（Dark Grayish Blue）*/
  --sub: #374151; /* 現代感、低飽和度的深藍灰色（也稱為 Charcoal 木炭色或 Cloud Burst 深雲灰）*/
  --no-data: #9ca3af;
  --hover: rgba(0,0,0,0.04);
      --jade-green:#00A86B;
      --neon-red:#FF3131;
      --neon-blue:#00F9FF;
      --gray-950:#0b1220; /* Chinese black or dark navy, ideal for moody dark-mode UI backgrounds */
      --gray-900:#0f1724; /* a very dark, near-black color with a subtle blue/indigo undertone, [Mirage or Dark Midnight] */
      --gray-850:#111827; /* like darker Midnight */
      --gray-800:#1f2937; /* a very dark, muted blue-gray color ,like [Midnight] */
      --gray-700:#374151; /* like dark sky grey */
      --gray-400:#9ca3af; /* like medium sky grey */
      --slate-100:#e6eef6; /* like light sky grey */
      --amber-400:#f59e0b; /* like orange 橙色 */
      --emerald-400:#34d399; /* like lime green 綠 */
      --emerald-600:#059669; /* like dark lime green */
      --emerald-500:#10b981; /* like lime green2 */
      --sky-400:#38bdf8; /* like sky blue 天藍*/
      --black-70: rgba(0,0,0,0.7); /* black 0.7: The Alpha channel, which controls opacity. It ranges from 0.0 (completely transparent) to 1.0 (completely opaque). A value of 0.7 means the color is 70% opaque (or 30% transparent) */
      --white:#ffffff;
      --base-font: "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;

      /* Default (mobile-first) responsive variables */
      --card-padding: 4px;
      --card-gap: 2px;
      --route-font-size: 24px;
      --dest-font-size: 11px;
      --stop-font-size: 12px;
      --eta-primary-size: 28px;
      --eta-secondary-size: 10px;
    }

/* Dark 主題覆蓋 */
[data-theme="dark"] {
  --header-color: ;
  --header-Date-text: #9ca3af; /*--gray-400;輕微藍色調的淺中灰色*/
  --header-Time-text: #34d399; /*--emerald-400;lime green 綠*/
  --header-bg: rgba(15,23,36,0.5); /*深暗藍黑*/
  --bg: #08111f; /*極深的藍黑色*/
  --card: rgba(17, 28, 47, .88); /*極深的藍色*/
  --card-solid: #111c2f; /* 非常深的暗藍色（或稱深海藍、午夜藍）*/
  --text: #f3f7ff; /* 非常淡的藍色，稱為愛麗絲藍（Alice Blue）*/
  --sub: #bbb; /* 中等偏淺的灰色。*/
  --no-data: #666; /* 暗灰色（Dark Gray）*/
  --hover: rgba(255,255,255,0.08);
}
    /* Grid for cards */
    .cards-grid {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:1px;
      padding:1px;
      font-size: 10px; /*.875rem*/
    }

.card {
  background: var(--card);
  border: 1px solid var(--card-solid);
  color: var(--text);
}

.eta-main {
  color: var(--text);
}

.sub-cell {
  color: var(--sub);
}

.no-data {
  color: var(--no-data);
}

.stops-row {
  color: var(--text);
}
.stops-row:hover {
  background: var(--hover);
}

    /* Layout helpers */
    .max-w-7xl{max-width:80rem;margin-left:auto;margin-right:auto;}
    .mx-auto{margin-left:auto;margin-right:auto;}
    .px-2{padding-left:.5rem;padding-right:.5rem;}
    .px-4{padding-left:1rem;padding-right:1rem;}
    .py-3{padding-top:.75rem;padding-bottom:.75rem;}
    .p-3{padding:.75rem;}
    .p-4{padding:1rem;}
    .p-2{padding:.5rem;}
    .p-1{padding:.25rem;}
    .flex{display:flex;}
    .items-center{align-items:center;}
    .justify-between{justify-content:space-between;}
    .justify-end{justify-content:flex-end;}
    .justify-center{justify-content:center;}
    .gap-1{gap:.25rem;}
    .gap-2{gap:.5rem;}
    .min-w-0{min-width:0;}
    .flex-1{flex:1 1 0%;}
    .text-center{text-align:center;}
    .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .hidden{display:none;}

    .top-0{top:0;}
    .z-40{z-index:40;}

    .inset-0{top:0;right:0;bottom:0;left:0;}
    .overflow-y-auto{overflow-y:auto;}
    .max-h-40{max-height:10rem;}
    .max-h-48{max-height:12rem;}
    .rounded{border-radius:.25rem;}
    .rounded-lg{border-radius:.5rem;}
    .rounded-xl{border-radius:.75rem;}
    .shadow-2xl{box-shadow:0 25px 50px -12px rgba(0,0,0,0.75);}
    .shadow { box-shadow: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1); }

    /* Colors & text */
    .bg-gray-950{background-color:var(--gray-950);}
    .bg-gray-900{background-color:var(--gray-900);}
    .bg-gray-900-50{background-color: rgba(17,24,39,0.5);}
    .bg-gray-800{background-color:var(--gray-800);}
    .bg-gray-850{background-color:var(--gray-850);}
    .bg-black-70{background-color:var(--black-70);}
    .bg-emerald-600{background-color:var(--emerald-600);}
    .bg-emerald-500{background-color:var(--emerald-500);}
    .bg-slate-50{background-color:#f8fafc;}
    .bg-white{background-color:var(--white);}
    .bg-white-80{background-color:rgba(255,255,255,0.8);}

    .text-slate-100{color:var(--slate-100);}
    .text-slate-800{color:#1f2937;}
    .text-gray-400{color:var(--gray-400);}
    .text-gray-500{color:#6b7280;}
    .text-gray-300{color:#d1d5db;}
    .text-white{color:var(--white);}
    .text-amber-400{color:var(--amber-400);}
    .text-emerald-400{color:var(--emerald-400);}
    .text-sky-400{color:var(--sky-400);}
    .text-red-400{color:#fb7185;}
    .text-gray-600{color:#4b5563;}
    .text-slate-700{color:#374151;}
    .text-stone-500{color:#78716c;}

    .font-sans{font-family:var(--base-font);}
    .font-mono{font-family:var(--text-mono);}
    .font-medium{font-weight:500;}
    .font-bold{font-weight:700;}
    .font-black{font-weight:900;}

    .text-xs{font-size:.75rem;line-height:1rem;}
    .text-sm{font-size:.875rem;line-height:1.25rem;}
    .text-base{font-size:1rem;}
    .text-lg{font-size:1.125rem;}
    .text-xl{font-size:1.25rem;}
    .text-9{font-size:9px;line-height:1rem;}
    .text-10{font-size:10px;line-height:1rem;}

    .tracking-wider{letter-spacing:.08em;}
    .tracking-tight{letter-spacing:-.01em;}

    .uppercase{text-transform:uppercase;}
    .placeholder-gray-600::placeholder{color:#4b5563;}
    .opacity-50{opacity:.5;}

    /* Buttons */
    .btn {
      display:inline-flex; align-items:center; justify-content:center;
      padding:.125rem .1rem; border-radius:.5rem; border:1px solid transparent;
      cursor:pointer; transition: all .15s ease;
      background:transparent; color:inherit;
    }
    .btn-ghost { background:transparent; border:0; padding:.25rem; }
    .btn-primary { background:var(--emerald-600); color:#fff; border-radius:.5rem; padding:.375rem .75rem; }


    /* Stops list & checkbox */
    .stop-checkbox {
      width:14px; height:14px; border-radius:4px; vertical-align:middle;
      accent-color:var(--emerald-600); background-color:#111827; border:1px solid #374151; margin:0;
    }
    .stops-row { display:flex; align-items:center; gap:.5rem; padding:.5rem; cursor:pointer; transition: background-color .15s ease; user-select:none; }

	/* Card styles */
	/* space-between：首尾貼邊，間距全留在元素之間。
	space-around：每個元素兩側的間距相等，因此元素與容器邊緣的距離，會是元素與元素之間距離的一半。
	space-evenly：絕對均分，無論是元素之間還是與邊緣之間，所有的空白間距都一模一樣。*/
    .card { padding: var(--card-padding); border-radius:.5rem; border:1px solid; display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden; transition: all .15s ease; gap: var(--card-gap); }

    .chip { display:inline-block; padding:2px 4px; border-radius:4px; font-weight:700; font-size:calc(var(--route-font-size) * 0.45); color:#fff; }
    .chip.kmb { background:#dc2626; }
    .chip.ctb { background:#f59e0b; }

    .card-title { font-weight:700; font-family:var(--base-font); font-size:var(--route-font-size); letter-spacing:-0.01em; }
    .card-sub { margin-top:.125rem; font-size:var(--dest-font-size); opacity:.7; }
    .card-stop { padding-top:.25rem; font-weight:700; font-size:var(--stop-font-size); }

    /* ETA styles (primary larger, secondary smaller) */
    .eta-main { color:var(--neon-blue); text-align:center; padding:.375rem 0; font-family:var(--base-font); font-size:var(--eta-primary-size); line-height:1; font-weight:700; min-height: calc(var(--eta-primary-size) * 1.05); display:flex; align-items:baseline; justify-content:center; }
    .eta-unit { font-size:calc(var(--eta-secondary-size)); font-weight:700; margin-left:6px; }

    .eta-subs { display:grid; grid-template-columns:repeat(2,1fr); gap:.25rem; margin-top:.25rem; }
    .sub-cell { padding:.25rem .375rem; border-radius:6px; text-align:center; font-family:var(--base-font); font-weight:700; font-size:var(--eta-secondary-size); border:1px solid transparent; }
/*    .sub-dark { background: rgba(17,24,39,0.5); color:#9ca3af; border-color: rgba(17,24,39,0.6); }
    .sub-light { background: #f1f5f9; color:#78716c; border-color: #e6eef6; } */
    .no-data-dashed { opacity:.2; border-style:dashed; }

/*    .no-data-dark { background: rgba(17,24,39,0.4); color: #9ca3af; padding:.5rem; border-radius:6px; } */
   /* bg: rgba: dark slate or navy-gray hue(深板岩色或海軍灰調 = #111827) with 40% opacity;
      #9ca3af 輕微藍色調的淺中灰色(Muted Gray-Blue = gray-400) */
/*    .no-data-light { background: #f1f5f9; color: #94a3b8; padding:.5rem; border-radius:6px; } */
   /* bg: #f1f5f9 非常淺的灰藍色(Light Grayish Blue / Alice Blue = slate-100);
      #94a3b8 灰色調、低飽和度的淡藍灰色(Slate Blue / Rock Blue = slate-400) */
    .warning { color:#f97316; font-weight:700; opacity:1; border:1px solid rgba(249,115,22,0.12); padding:.25rem; border-radius:6px; }
	/* #(orange-500)vivid, high-energy orange(鮮豔、活力橙色); 
	   border: rgba translucent bright orange color with an alpha opacity of 12% (半透明的亮橙色) */
    .imminent { color:#ef4444; font-weight:800; border:1px solid rgba(239,68,68,0.12); padding:.25rem; border-radius:6px; } 
	/* #(red-500) high-chroma red(高色彩紅色); 
	   border: rgba semi-transparent shade of red with an opacity of 12%(半透明紅色) */
    .error { color:#fb7185; background: rgba(251,113,133,0.06); padding:.25rem; border-radius:6px; } 
	/* # vibrant shade of pink or light red(鮮豔的粉紅 = rose-400); 
	   bg: rgba (rose-400)soft pink/rose color with only 6% opacity(玫瑰色) */

    @keyframes flash {
      0%,100% { opacity:1; background-color: rgba(239,68,68,0.18); }
      50% { opacity:.7; background-color: rgba(239,68,68,0.06); }
    }
    .animate-flash { animation: flash 1.2s infinite ease-in-out; }

    /* Modal */
    .modal-backdrop { background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:1rem; z-index:50; }
    .modal-card { background:var(--gray-900); border:1px solid var(--gray-800); border-radius:12px; width:100%; max-width:36rem; box-shadow:0 25px 50px -12px rgba(0,0,0,0.75); display:flex; flex-direction:column; max-height:90vh; color:var(--slate-100); }

    .modal-header { padding:.75rem; border-bottom:1px solid var(--gray-800); display:flex; align-items:center; justify-content:space-between; }
    .modal-body { padding:.75rem; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:.75rem; }
    .modal-footer { padding:.75rem; border-top:1px solid var(--gray-800); display:flex; justify-content:flex-end; background: rgba(15,23,36,0.5); }

    /* Modal list */
    .modal-row { display:flex; align-items:center; justify-content:space-between; gap:.5rem; padding:.5rem; transition: background-color .15s ease; }
    .modal-row.light-hover:hover { background-color:#f1f5f9; }
    .modal-row.dark-hover:hover { background-color:#0b1220; }
    .modal-chip { display:inline-block; padding:2px 6px; border-radius:4px; font-size:8px; color:#fff; background:#374151; }
    .modal-route { font-weight:700; font-family:var(--base-font); color:var(--emerald-500); }
    .modal-dest { opacity:.6; font-size:10px; }

    .modal-actions { display:flex; gap:.375rem; align-items:center; flex-shrink:0; }
    .action-btn { background:transparent; border:0; padding:0; font-weight:600; cursor:pointer; color:var(--sky-400); }
    .action-btn.danger { color:#fb7185; }/*鮮豔的粉紅*/

    /* Empty states */
    .empty-state { text-align:center; padding:4rem 1rem; color:#6b7280; }
    .hidden { display:none; }

    /* Smooth transitions for variable changes */
    .card, .eta-main, .eta-subs .sub-cell {
      transition: font-size .18s ease, padding .18s ease, gap .18s ease;
    }

select {
  -webkit-appearance: none; /* 移除 Android Chrome 預設外觀 */
  -moz-appearance: none;
  appearance: none;
  background-color: var(--sel-bg); /* rock dark: #1a1a1a; extra-light skyblue: #F4FBFD; */

border-radius: 8px;
}

#w-upd {

  font-size: 0.8rem;
  }

  .weather-container {
    max-width: 100% ;
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 0px;

  <script>
/* Part 1: State, DOM refs, helpers, persistence */

let savedDashboardItems = JSON.parse(localStorage.getItem('hk_bus_dashboard_cards')) || [];
let currentTheme = localStorage.getItem('data-theme') || 'dark';
let currentInterval = parseInt(localStorage.getItem('hk_bus_interval')) || 30000;
let displayCount = parseInt(localStorage.getItem('hk_bus_display_count')) || 3;
let debugMode = localStorage.getItem('hk_bus_debug') === 'true' || false;

let loadedRouteConfig = null;
let activeDirection = 'outbound';
let globalTimer = null;

/* In-memory caches */
const etaCache = new Map();
const cacheTTL = 10 * 1000;

/* Concurrency */
const BATCH_SIZE = 6;
const BATCH_DELAY_MS = 300;

/* DOM */
const elements = {
  themeToggleBtn: document.getElementById('themeToggleBtn'),
  exportBtn: document.getElementById('exportBtn'),
  importBtn: document.getElementById('importBtn'),
  importFile: document.getElementById('importFile'),
  headerDate: document.getElementById('headerDate'),
  headerTime: document.getElementById('headerTime'),
  openModalBtn: document.getElementById('openModalBtn'),
  closeModalBtn: document.getElementById('closeModalBtn'),
  cancelModalBtn: document.getElementById('cancelModalBtn'),
  settingsModal: document.getElementById('settingsModal'),
  modalCard: document.getElementById('modalCard'),
  intervalSelect: document.getElementById('intervalSelect'),
  companySelect: document.getElementById('companySelect'),
  routeInput: document.getElementById('routeInput'),
  searchRouteBtn: document.getElementById('searchRouteBtn'),
  directionTabsContainer: document.getElementById('directionTabsContainer'),
  tabInbound: document.getElementById('tabInbound'),
  tabOutbound: document.getElementById('tabOutbound'),
  textInboundDest: document.getElementById('textInboundDest'),
  textOutboundDest: document.getElementById('textOutboundDest'),
  stopsListContainer: document.getElementById('stopsListContainer'),
  stopsListItems: document.getElementById('stopsListItems'),
  selectAllStops: document.getElementById('selectAllStops'),
  saveSelectedStopsBtn: document.getElementById('saveSelectedStopsBtn'),
  modalManageList: document.getElementById('modalManageList'),
  busCardsGrid: document.getElementById('busCardsGrid'),
  emptyState: document.getElementById('emptyState')
};

/* Helpers */
function logDebug(...args) { if (debugMode) console.debug('[HK-BUS-DBG]', ...args); }
function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

async function fetchWithRetry(url, options = {}, retries = 3, baseDelay = 300) {
  let attempt = 0;
  while (attempt <= retries) {
    try {
      const res = await fetch(url, options);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    } catch (err) {
      attempt++;
      if (attempt > retries) throw err;
      const delay = baseDelay * Math.pow(2, attempt - 1);
      logDebug(`fetchWithRetry: retry ${attempt} for ${url} after ${delay}ms`);
      await sleep(delay + Math.random() * 100);
    }
  }
}

function cacheKey(company, stopId) { return `${company}|${stopId}`; }
function getCachedEta(company, stopId) {
  const key = cacheKey(company, stopId);
  const entry = etaCache.get(key);
  if (!entry) return null;
  if (Date.now() - entry.ts > cacheTTL) { etaCache.delete(key); return null; }
  return entry.data;
}
function setCachedEta(company, stopId, data) { etaCache.set(cacheKey(company, stopId), { data, ts: Date.now() }); }

function setHeaderLastUpdated(ts = Date.now()) {
  let el = document.getElementById('headerLastUpdated');
  const formatted = new Date(ts).toLocaleTimeString();
  if (!el) {
    el = document.createElement('div');
    el.id = 'headerLastUpdated';
    el.style.fontSize = '12px';
    el.style.opacity = '0.8';
    el.style.marginTop = '2px';
    if (elements.headerTime && elements.headerTime.parentElement) {
      elements.headerTime.parentElement.appendChild(el);
    } else {
      const header = document.querySelector('header');
      if (header) header.appendChild(el);
    }
  }
  el.textContent = `最後更新：${formatted}`;
}

/* Persistence helpers */
function saveDashboardItems() {
  try {
    localStorage.setItem('hk_bus_dashboard_cards', JSON.stringify(savedDashboardItems));
  } catch (e) {
    console.error('saveDashboardItems error', e);
  }
}

/* Simple escape to avoid XSS in inserted text */
function escapeHtml(str) {
  if (typeof str !== 'string') return '';
  return str.replace(/[&<>"']/g, function(m) {
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]);
  });
}

/* Part 2: Rendering and centralized move/remove/edit */

/* Dashboard rendering (no inline responsive sizing)
   Uses centralized moveItemUp / moveItemDown */
function renderDashboardCards() {
  if (!elements.busCardsGrid) return;
  elements.busCardsGrid.innerHTML = "";
  if (!Array.isArray(savedDashboardItems) || savedDashboardItems.length === 0) {
    if (elements.emptyState) elements.emptyState.classList.remove('hidden');
    return;
  }
  if (elements.emptyState) elements.emptyState.classList.add('hidden');

  const isDark = currentTheme === 'dark';

  savedDashboardItems.forEach((card, index) => {
    const col = document.createElement('div');
    col.classList.add('card', isDark ? 'dark' : 'light');

    // Top
    const top = document.createElement('div');

    const topRow = document.createElement('div');
    topRow.style.display = 'flex';
    topRow.style.alignItems = 'center';
    topRow.style.justifyContent = 'space-between';
    topRow.style.gap = '.125rem';

    const left = document.createElement('div');
    left.style.display = 'flex';
    left.style.alignItems = 'center';
    left.style.gap = '.25rem';
    left.style.minWidth = '0';

    const chip = document.createElement('span');
    chip.classList.add('chip', card.company === 'KMB' ? 'kmb' : 'ctb');
    chip.textContent = card.company;

    const title = document.createElement('span');
    title.classList.add('card-title','truncate');
    title.textContent = card.route;

    left.appendChild(chip);
    left.appendChild(title);

    // NOTE: No controls appended here — main page will not show up/down buttons

    topRow.appendChild(left);
    // If you want something on the right (e.g., a small menu), add it here.
    // topRow.appendChild(someRightElement);

    const destLine = document.createElement('div');
    destLine.classList.add('card-sub');
    destLine.textContent = `往 ${card.destination}`;

    const stopWrap = document.createElement('div');
    stopWrap.style.marginTop = '.25rem';
    stopWrap.style.paddingTop = '.25rem';
    stopWrap.style.borderTop = isDark ? '1px solid rgba(255,255,255,0.03)' : '1px solid rgba(0,0,0,0.04)';

    const stopName = document.createElement('div');
    stopName.classList.add('card-stop');
    stopName.textContent = card.stopName;

    stopWrap.appendChild(stopName);

    top.appendChild(topRow);
    top.appendChild(destLine);
    top.appendChild(stopWrap);

    // ETA area
    const etaArea = document.createElement('div');
    etaArea.style.marginTop = '.5rem';
    etaArea.style.display = 'flex';
    etaArea.style.flexDirection = 'column';
    etaArea.style.gap = '.25rem';

    const etaMain = document.createElement('div');
    etaMain.id = `eta-main-${card.uuid}`;
    etaMain.classList.add('eta-main');
    etaMain.textContent = '載入中...';

    const etaSubs = document.createElement('div');
    etaSubs.id = `eta-subs-${card.uuid}`;
    etaSubs.classList.add('eta-subs');

    etaArea.appendChild(etaMain);
    etaArea.appendChild(etaSubs);

    col.appendChild(top);
    col.appendChild(etaArea);

    elements.busCardsGrid.appendChild(col);
  });
}


/* Modal management list (centralized rendering with Up/Down/Delete/Edit) */
function renderModalManagementList() {
  if (!elements.modalManageList) return;
  elements.modalManageList.innerHTML = "";
  if (!Array.isArray(savedDashboardItems) || savedDashboardItems.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'modal-row';
    empty.style.padding = '.75rem';
    empty.style.textAlign = 'center';
    empty.style.color = '#6b7280';
    empty.style.opacity = '0.6';
    empty.textContent = '暫無追蹤卡片';
    elements.modalManageList.appendChild(empty);
    return;
  }

  const isDark = currentTheme === 'dark';

  savedDashboardItems.forEach((item, index) => {
    const row = document.createElement('div');
    row.classList.add('modal-row');
    row.classList.add(isDark ? 'dark-hover' : 'light-hover');
    row.style.display = 'flex';
    row.style.alignItems = 'center';
    row.style.justifyContent = 'space-between';
    row.style.gap = '.5rem';
    row.style.padding = '.5rem';

    const left = document.createElement('div');
    left.style.minWidth = '0';
    left.style.flex = '1';

    const meta = document.createElement('div');
    meta.style.display = 'flex';
    meta.style.alignItems = 'center';
    meta.style.gap = '.5rem';

    const chip = document.createElement('span');
    chip.className = 'modal-chip';
    chip.textContent = item.company;

    const route = document.createElement('span');
    route.className = 'modal-route';
    route.textContent = item.route;

    const dest = document.createElement('span');
    dest.className = 'modal-dest';
    dest.textContent = `→ 往 ${item.destination}`;

    meta.appendChild(chip);
    meta.appendChild(route);
    meta.appendChild(dest);

    const info = document.createElement('div');
    info.className = 'truncate';
    info.style.marginTop = '.25rem';
    info.style.fontSize = '11px';
    info.style.fontWeight = '500';
    info.style.opacity = '.8';
    info.textContent = `${item.stopName} (${item.stopId})`;

    left.appendChild(meta);
    left.appendChild(info);

    const actions = document.createElement('div');
    actions.className = 'modal-actions';
    actions.style.display = 'flex';
    actions.style.alignItems = 'center';
    actions.style.gap = '.25rem';

    // Move up button
    const upBtn = document.createElement('button');
    upBtn.className = 'action-btn';
    upBtn.type = 'button';
    upBtn.title = '上移';
    upBtn.textContent = '⬆️';
    upBtn.disabled = index === 0;
    upBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      moveItemUp(index);
    });

    // Move down button
    const downBtn = document.createElement('button');
    downBtn.className = 'action-btn';
    downBtn.type = 'button';
    downBtn.title = '下移';
    downBtn.textContent = '⬇️';
    downBtn.disabled = index === savedDashboardItems.length - 1;
    downBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      moveItemDown(index);
    });

    const editBtn = document.createElement('button');
    editBtn.className = 'action-btn';
    editBtn.type = 'button';
    editBtn.textContent = '✏️';
    editBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      editCardInline(item.company, item.route);
      elements.settingsModal.classList.remove('hidden');
      elements.settingsModal.setAttribute('aria-hidden','false');
    });

    const delBtn = document.createElement('button');
    delBtn.className = 'action-btn danger';
    delBtn.type = 'button';
    delBtn.textContent = '🗑️';
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (confirm(`確定要刪除 ${item.company} ${item.route} ${item.stopName} 嗎？`)) {
        removeCard(item.uuid);
      }
    });

    actions.appendChild(upBtn);
    actions.appendChild(downBtn);
    actions.appendChild(editBtn);
    actions.appendChild(delBtn);

    row.appendChild(left);
    row.appendChild(actions);

    elements.modalManageList.appendChild(row);
  });
}

/* Centralized move logic */
function moveItemUp(index) {
  if (!Array.isArray(savedDashboardItems) || index <= 0 || index >= savedDashboardItems.length) return;
  const tmp = savedDashboardItems[index - 1];
  savedDashboardItems[index - 1] = savedDashboardItems[index];
  savedDashboardItems[index] = tmp;
  saveDashboardItems();
  renderModalManagementList();
  renderDashboardCards();
  resetIntervalTimer();
}

function moveItemDown(index) {
  if (!Array.isArray(savedDashboardItems) || index < 0 || index >= savedDashboardItems.length - 1) return;
  const tmp = savedDashboardItems[index + 1];
  savedDashboardItems[index + 1] = savedDashboardItems[index];
  savedDashboardItems[index] = tmp;
  saveDashboardItems();
  renderModalManagementList();
  renderDashboardCards();
  resetIntervalTimer();
}

/* Part 3: Route search, stops rendering, save selected cards */

async function handleRouteSearch() {
  if (!elements.companySelect || !elements.routeInput || !elements.searchRouteBtn) return;
  const company = elements.companySelect.value;
  const route = elements.routeInput.value.trim().toUpperCase();
  if (!route) return;

  elements.searchRouteBtn.disabled = true;
  elements.searchRouteBtn.textContent = "搜尋中...";

  try {
    if (company === 'CTB') {
      const json = await fetchWithRetry(`https://rt.data.gov.hk/v1/transport/citybus-nwfb/route/CTB/${route}`);
      if (!json.data || Object.keys(json.data).length === 0) { alert("找不到該城巴路線，請檢查輸入。"); return; }
      loadedRouteConfig = { company: 'CTB', route: route, inbound: { dest: json.data.orig_tc }, outbound: { dest: json.data.dest_tc } };
    } else if (company === 'KMB') {
      const json = await fetchWithRetry(`https://data.etabus.gov.hk/v1/transport/kmb/route/${route}/outbound/1`);
      if (!json.data || Object.keys(json.data).length === 0) { alert("找不到該九巴路線，請檢查輸入。"); return; }
      loadedRouteConfig = { company: 'KMB', route: route, inbound: { dest: json.data.orig_tc }, outbound: { dest: json.data.dest_tc } };
    }

    if (elements.textInboundDest) elements.textInboundDest.textContent = loadedRouteConfig.inbound.dest;
    if (elements.textOutboundDest) elements.textOutboundDest.textContent = loadedRouteConfig.outbound.dest;
    if (elements.directionTabsContainer) elements.directionTabsContainer.classList.remove('hidden');

    switchDirectionTab('outbound');
  } catch (err) {
    console.error(err);
    alert("獲取路線錯誤。");
  } finally {
    elements.searchRouteBtn.disabled = false;
    elements.searchRouteBtn.textContent = "搜尋";
  }
}

/* Direction tab */
function switchDirectionTab(direction) {
  if (!loadedRouteConfig) return;
  activeDirection = direction;
  const isDark = currentTheme === 'dark';

  function setTabActive(tabEl, active) {
    tabEl.classList.remove('active-tab');
    tabEl.classList.add('btn');
    tabEl.style.background = 'transparent';
    tabEl.style.color = isDark ? '#9ca3af' : '#6b7280';
    if (active) { tabEl.style.background = 'var(--emerald-600)'; tabEl.style.color = '#fff'; tabEl.style.boxShadow = '0 4px 6px rgba(0,0,0,0.1)'; }
  }

  if (elements.tabInbound) setTabActive(elements.tabInbound, direction === 'inbound');
  if (elements.tabOutbound) setTabActive(elements.tabOutbound, direction === 'outbound');

  if (elements.stopsListContainer) elements.stopsListContainer.classList.add('hidden');
  if (elements.stopsListItems) elements.stopsListItems.innerHTML = `<div class="stops-row text-9 opacity-50" style="text-align:center;padding:1rem;">載入巴士站列表中...</div>`;
  if (elements.saveSelectedStopsBtn) elements.saveSelectedStopsBtn.disabled = true;

  (async () => {
    try {
      const company = loadedRouteConfig.company;
      const route = loadedRouteConfig.route;
      const url = company === 'CTB'
        ? `https://rt.data.gov.hk/v1/transport/citybus-nwfb/route-stop/CTB/${route}/${direction}`
        : `https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/${direction}/1`;

      const json = await fetchWithRetry(url);
      if (!json.data || json.data.length === 0) {
        if (elements.stopsListItems) elements.stopsListItems.innerHTML = `<div class="stops-row text-9 text-red-400" style="text-align:center;padding:1rem;">此方向暫無站點數據。</div>`;
        if (elements.stopsListContainer) elements.stopsListContainer.classList.remove('hidden');
        return;
      }

      const slicedData = json.data.slice(0,45);
      const promises = slicedData.map(async (item) => {
        const nameUrl = company === 'CTB'
          ? `https://rt.data.gov.hk/v1/transport/citybus-nwfb/stop/${item.stop}`
          : `https://data.etabus.gov.hk/v1/transport/kmb/stop/${item.stop}`;
        const nameJson = await fetchWithRetry(nameUrl);
        return { stopId: item.stop, stopName: nameJson.data?.name_tc || '未知站名' };
      });

      const stopsData = await Promise.all(promises);
      renderStopsCheckboxes(stopsData);
    } catch (err) {
      console.error(err);
      if (elements.stopsListItems) elements.stopsListItems.innerHTML = `<div class="stops-row text-9 text-red-400" style="text-align:center;padding:1rem;">站點載入失敗，請重試。</div>`;
      if (elements.stopsListContainer) elements.stopsListContainer.classList.remove('hidden');
    }
  })();
}

/* Stops rendering */
function renderStopsCheckboxes(stops) {
  if (!elements.stopsListItems) return;
  elements.stopsListItems.innerHTML = "";
  const isDark = currentTheme === 'dark';

  stops.forEach((stop, index) => {
    const label = document.createElement('label');
    label.classList.add('stops-row');
    label.classList.add(isDark ? 'dark-hover' : 'light-hover');
    label.classList.add(isDark ? 'dark-text' : 'light-text');

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.dataset.id = stop.stopId;
    checkbox.dataset.name = stop.stopName;
    checkbox.classList.add('stop-checkbox');

    const info = document.createElement('div');
    info.style.flex = '1';
    info.style.minWidth = '0';

    const meta = document.createElement('div');
    meta.classList.add('font-sans','text-9');
    meta.style.opacity = '0.5';
    meta.textContent = `${index + 1}. ID: ${stop.stopId}`;

    const nameDiv = document.createElement('div');
    nameDiv.classList.add('truncate');
    nameDiv.style.fontWeight = '600';
    nameDiv.style.fontSize = '.75rem';
    nameDiv.textContent = stop.stopName;

    info.appendChild(meta);
    info.appendChild(nameDiv);

    label.appendChild(checkbox);
    label.appendChild(info);

    checkbox.addEventListener('change', () => {
      const checkedCount = elements.stopsListItems.querySelectorAll('.stop-checkbox:checked').length;
      elements.saveSelectedStopsBtn.disabled = checkedCount === 0;
    });

    elements.stopsListItems.appendChild(label);
  });

  elements.stopsListContainer.classList.remove('hidden');
}

function toggleSelectAllStops() {
  if (!elements.stopsListItems) return;
  const boxes = elements.stopsListItems.querySelectorAll('.stop-checkbox');
  if (boxes.length === 0) return;
  const anyUnchecked = Array.from(boxes).some(b => !b.checked);
  boxes.forEach(b => b.checked = anyUnchecked);
  elements.saveSelectedStopsBtn.disabled = !anyUnchecked;
}

function saveSelectedDashboardCards() {
  if (!elements.stopsListItems || !loadedRouteConfig) return;
  const checked = elements.stopsListItems.querySelectorAll('.stop-checkbox:checked');
  const dest = activeDirection === 'inbound' ? loadedRouteConfig.inbound.dest : loadedRouteConfig.outbound.dest;

  checked.forEach(box => {
    const id = box.dataset.id;
    const name = box.dataset.name;
    const uuid = `${loadedRouteConfig.company}-${loadedRouteConfig.route}-${id}-${activeDirection}`;

    if (!savedDashboardItems.some(item => item.uuid === uuid)) {
      savedDashboardItems.push({
        uuid, company: loadedRouteConfig.company, route: loadedRouteConfig.route,
        direction: activeDirection, destination: dest, stopId: id, stopName: name
      });
    }
  });

  saveDashboardItems();
  renderDashboardCards();
  renderModalManagementList();
  resetIntervalTimer();

  elements.stopsListContainer.classList.add('hidden');
  elements.saveSelectedStopsBtn.disabled = true;
  elements.stopsListItems.innerHTML = "";
}

/* Part 4: ETA fetching, UI update, import/export, events, init */

/* Fetch ETAs (batched, dedupe minutes, top N) */
async function fetchAllEtas() {
  if (!Array.isArray(savedDashboardItems) || savedDashboardItems.length === 0) return;

  const tasks = savedDashboardItems.map(card => ({ card }));

  for (let i = 0; i < tasks.length; i += BATCH_SIZE) {
    const batch = tasks.slice(i, i + BATCH_SIZE);
    await Promise.all(batch.map(async ({ card }) => {
      const mainBox = document.getElementById(`eta-main-${card.uuid}`);
      const subsBox = document.getElementById(`eta-subs-${card.uuid}`);
      if (!mainBox || !subsBox) return;

      mainBox.classList.remove('warning','imminent','error','animate-flash');
      mainBox.classList.add('eta-main');
      mainBox.textContent = '載入中...';
      subsBox.innerHTML = '';

      try {
        const cached = getCachedEta(card.company, card.stopId);
        let etas = null;
        if (cached) {
          etas = cached;
          logDebug('cache hit', card.company, card.stopId);
        } else {
          if (card.company === 'CTB') {
            const json = await fetchWithRetry(`https://rt.data.gov.hk/v1/transport/batch/stop-eta/CTB/${card.stopId}?lang=zh-hant`);
            etas = (json.data || []).filter(item => item.route === card.route && item.dir === (card.direction === 'inbound' ? 'I' : 'O')).map(item => ({ timeStr: item.eta }));
          } else if (card.company === 'KMB') {
            const json = await fetchWithRetry(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${card.stopId}`);
            etas = (json.data || []).filter(item => item.route === card.route).map(item => ({ timeStr: item.eta }));
          } else {
            etas = [];
          }
          setCachedEta(card.company, card.stopId, etas);
        }

        const now = new Date();
        const minutesArr = (etas || [])
          .map(e => {
            if (!e.timeStr) return null;
            const t = new Date(e.timeStr);
            if (isNaN(t)) return null;
            const diff = Math.floor((t - now) / 1000 / 60);
            return Math.max(0, diff);
          })
          .filter(v => v !== null);

        const uniqueMinutes = [];
        minutesArr.forEach(m => { if (!uniqueMinutes.includes(m)) uniqueMinutes.push(m); });

        uniqueMinutes.sort((a, b) => a - b);
        const topN = uniqueMinutes.slice(0, displayCount).map(m => ({ minutes: m }));

        updateEtaDisplayComponents(card.uuid, topN);
      } catch (err) {
        console.error('ETA fetch error for', card, err);
        mainBox.classList.remove('warning','imminent');
        mainBox.classList.add('error');
        mainBox.textContent = '更新失敗';
        subsBox.innerHTML = '';
      }
    }));
    await sleep(BATCH_DELAY_MS);
  }

  // update single header timestamp after all batches
//del the head double slash will be workback//  setHeaderLastUpdated(Date.now());
}

/* Update ETA UI (content only) */
function updateEtaDisplayComponents(uuid, list) {
  const mainBox = document.getElementById(`eta-main-${uuid}`);
  const subsBox = document.getElementById(`eta-subs-${uuid}`);
  if (!mainBox || !subsBox) return;

  mainBox.classList.remove('warning','imminent','error','animate-flash','no-data-dark','no-data-light');
  subsBox.innerHTML = '';

  if (!list || list.length === 0) {
    mainBox.classList.add(currentTheme === 'dark' ? 'no-data-dark' : 'no-data-light');
    mainBox.textContent = "暫無";
    return;
  }

  const primary = list[0];
  // change eta primary color
  if (primary.minutes <= 0) {
    mainBox.classList.add('imminent','animate-flash'); // 鮮紅 ref: imminent
    mainBox.innerHTML = "到站中";
  } else if (primary.minutes <= 3) {
    mainBox.classList.add('warning'); // 鮮橙
    mainBox.innerHTML = `${primary.minutes}<span class="eta-unit">分</span>`;
  } else {
    mainBox.innerHTML = `${primary.minutes}<span class="eta-unit">分</span>`;
  }

  if (list.length > 1) {
    const trailingStyleClass = currentTheme === 'dark' ? 'sub-dark' : 'sub-light';
    const secondaryCount = Math.max(1, displayCount - 1);
    for (let i = 1; i <= secondaryCount; i++) {
      const cell = document.createElement('div');
      cell.classList.add('sub-cell', trailingStyleClass);
      if (list[i]) {
        cell.textContent = `${list[i].minutes}分`;
        if (list[i].minutes <= 0) cell.classList.add('imminent','animate-flash');
        else if (list[i].minutes <= 3) cell.classList.add('warning');
      } else {
        cell.classList.add('no-data-dashed');
        cell.textContent = '--';
      }
      subsBox.appendChild(cell);
    }
  }
}

/* Backup / restore (export) */
function exportJsonConfig() {
  let currentTheme = localStorage.getItem('data-theme') || 'dark';
  try {
    const backup = { theme: currentTheme, refreshInterval: currentInterval, displayCount, cards: savedDashboardItems };
    const data = JSON.stringify(backup, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `hk_bus_advanced_backup_${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (e) {
    console.error(e);
    alert('匯出失敗');
  }
}

/* Import (improved) */
function importJsonConfig(e) {
  const file = e.target && e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const data = JSON.parse(evt.target.result);
      if (!data || (!data.cards && !Array.isArray(data))) {
        alert("無效的備份格式！");
        return;
      }

      if (!confirm("確認匯入備份？這將會覆蓋您現有的所有卡片及主題設定。")) {
        return;
      }

      if (Array.isArray(data)) {
        savedDashboardItems = data;
      } else {
        savedDashboardItems = Array.isArray(data.cards) ? data.cards : [];
        if (data.theme) currentTheme = data.theme;
        if (data.refreshInterval) currentInterval = parseInt(data.refreshInterval) || currentInterval;
        if (data.displayCount) {
          displayCount = parseInt(data.displayCount) || displayCount;
          localStorage.setItem('hk_bus_display_count', displayCount);
        }
      }

      // Persist settings
      saveDashboardItems();
      localStorage.setItem('data-theme', currentTheme);
      localStorage.setItem('hk_bus_interval', currentInterval);

      // Apply theme and UI updates
      applyTheme(currentTheme);
      if (elements.intervalSelect) elements.intervalSelect.value = currentInterval.toString();

      // Re-render and restart update loop
      renderDashboardCards();
      renderModalManagementList();
      resetIntervalTimer();

      alert("🎉 設定還原成功！");
    } catch (err) {
      console.error('importJsonConfig error', err);
      alert("讀取檔案失敗，請確保上傳正確的 JSON 備份檔。");
    } finally {
      if (elements.importFile) elements.importFile.value = "";
    }
  };
  reader.readAsText(file);
}

/* Interval / update engine */
function resetIntervalTimer() {
  if (globalTimer) {
    clearInterval(globalTimer);
    globalTimer = null;
  }
  // Immediately update once, then set interval
  fetchAllEtas().catch(err => console.error(err));
  globalTimer = setInterval(() => {
    fetchAllEtas().catch(err => console.error(err));
  }, currentInterval);
}

 // if (elements.themeToggleBtn) elements.themeToggleBtn.addEventListener('click', () => applyTheme(currentTheme === 'dark' ? 'light' : 'dark'));

    if (elements.headerDate) elements.headerDate.textContent = `${now.getFullYear()}年${String(now.getMonth()+1).padStart(2,'0')}月${String(now.getDate()).padStart(2,'0')}日 ${days[now.getDay()]}`;
    if (elements.headerTime) elements.headerTime.textContent = now.toTimeString().split(' ')[0];
  }
  updateClock();
  setInterval(updateClock, 1000);
}

function relativeTime(dateStr) {
  if (!dateStr) return '';
  try {
    const cleaned = dateStr.replace(' ', 'T');
    const dt = new Date(cleaned);
    if (isNaN(dt.getTime())) return dateStr;
    const now = new Date();
    const diffMs = now - dt;
    const diffMins = Math.floor(diffMs / 60000);
    const diffHrs = Math.floor(diffMs / 3600000);
    if (diffMins < 1) return '剛剛更新';
    if (diffMins < 60) return diffMins + ' 分鐘前更新';
    if (diffHrs < 24) return diffHrs + ' 小時前更新';
    return dt.toLocaleDateString('zh-HK', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
  } catch(e) {
    return dateStr;
  }
}

  //document.getElementById('w-place').textContent = main.place ?? '--';
  document.getElementById('w-temp').textContent = main.value ? main.value + ' °C' : '--';

  const upTime = document.getElementById('w-upd');
  if (upTime) upTime.textContent = relativeTime(d.updateTime);

  // 更新雨量
  const region = getRainFallStationName(stationName);
  let rainValue = '0.0', rainDesc = '無';
  if (d.rainfall && Array.isArray(d.rainfall.data)) {
    const r = d.rainfall.data.find(i => i.place === region);
    if (r) {
      rainValue = r.max !== undefined ? r.max : (r.value ?? '0.0');
      const numRain = parseFloat(rainValue);
      if (numRain > 10) rainDesc = '高';
      else if (numRain > 2) rainDesc = '中等';
      else if (numRain > 0) rainDesc = '輕微';
    }
  }
  document.getElementById('curr-rain').textContent = `(${region}) 雨量 : ${rainValue} mm (${rainDesc})`;
}

function renderTodayMinMax(rhrRes) {
  let maxTemp = rhrRes.maxtempFrom00To09;
  let minTemp = rhrRes.mintempFrom00To09;

  // A 如果 API 沒有提供，兜底用各測站溫度計算
  if ((!maxTemp || !minTemp) && rhrRes.temperature?.data?.length > 0) {
    const temps = rhrRes.temperature.data.map(d => Number(d.value));
    maxTemp = Math.max(...temps);
    minTemp = Math.min(...temps);
  }

  document.getElementById("range-temp").textContent =
    `↓${minTemp ? minTemp + "°C" : "--"} ↑${maxTemp ? maxTemp + "°C" : "--"}`;
}

let backupMinTemp = '--';
let backupMaxTemp = '--';

async function fetchCurrentWeather() {
  try {
    const res = await fetch(`${WX_BASE}?dataType=rhrread&lang=tc`, { cache: 'no-store' });
    const data = await res.json();
    if (!data) return;

 // 用 API 的溫度站名生成下拉選單
  const temps = data.temperature?.data || [];
  selectEl.innerHTML = '<option value="">-- 請選擇 --</option>';
  temps.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t.place;
    opt.textContent = t.place;
    selectEl.appendChild(opt);
  });

// 嘗試載入之前儲存的選擇
const savedStation = localStorage.getItem("selectedStation");
if (savedStation && temps.some(t => t.place === savedStation)) {
  selectEl.value = savedStation;
  renderCurrentWeather(data, savedStation);
  //renderTodayMinMax(data);
} else {
  // 預設顯示香港天文台
  renderCurrentWeather(data, '香港天文台');
  //renderTodayMinMax(data);
  selectEl.value = '香港天文台';
}

    // 手動選擇站點
    selectEl.onchange = () => {
      const chosen = selectEl.value;
      if (chosen) {
        renderCurrentWeather(data, chosen);
       // renderTodayMinMax(data);
    // 儲存選擇的站點到瀏覽器
    localStorage.setItem("selectedStation", chosen);
      }
    };
//-- end of Select station module

    // 今日天氣大圖標
    const iconBox = document.getElementById('today-icon-container');
    const iconImg = document.getElementById('today-weather-icon');
    if (data.icon && Array.isArray(data.icon) && data.icon.length > 0 && iconImg && iconBox) {
      const iconNumber = data.icon[0]; 
      iconImg.src = `${ICON_BASE}${iconNumber}.png`;
      iconBox.style.display = 'flex';
    } else if (iconBox) {
      iconBox.style.display = 'none';
    }

     // B. 最高 / 最低氣溫智慧兜底
    let maxT = data.maxtemp?.value ?? backupMaxTemp;
    let minT = data.mintemp?.value ?? backupMinTemp;
    document.getElementById('range-temp').textContent = `↓${minT}°C↑${maxT}°C`;

    // 濕度
    let humiVal = '--';
    if (data.humidity && Array.isArray(data.humidity.data) && data.humidity.data.length > 0) {
      humiVal = data.humidity.data[0].value ?? '--';
    }
    document.getElementById('curr-humi').textContent = `${humiVal}%`;

    // 紫外線
    let uvPlace = '', uvVal = '0', uvDesc = '低';
    if (data.uvindex && data.uvindex.data && Array.isArray(data.uvindex.data) && data.uvindex.data.length > 0) {
      uvVal = data.uvindex.data[0].value ?? '0';
      uvPlace = data.uvindex.data[0].place ?? ''; //京士柏
      uvDesc = data.uvindex.data[0].desc ?? '';
    }
    document.getElementById('curr-uv').innerHTML= `${uvPlace} <br>紫外線指數 : ${uvVal} (${uvDesc})`;

    let rainValue = '0.0', rainDesc = '無';
    if (data.rainfall && Array.isArray(data.rainfall.data)) {
      const r = data.rainfall.data.find(i => i.place === resultRegion) || data.rainfall.data.find(i => i.main === true || i.main === "true"); // 降雨量共有18區即時半小時內測站
      if (r) {
rainValue = r.max !== undefined ? r.max : (r.value ?? '0.0');
const numRain = parseFloat(rainValue);
if (numRain > 10) rainDesc = '高';
else if (numRain > 2) rainDesc = '中等';
else if (numRain > 0) rainDesc = '輕微';
      }
    }
    document.getElementById('curr-rain').textContent = `(${resultRegion})  雨量 : ${rainValue} mm (${rainDesc})`;

  } catch (e) { console.error('實況錯誤已安全攔截:', e); }
}
//-- end of Select station module

const iconMap = {
  WRAINR: 'rainr.gif', WRAINA: 'raina.gif', WRAINB: 'rainb.gif',
  WFIREY: 'firey.gif', WFIRER: 'firer.gif', WTS: 'ts.gif',
  WMSGNL: 'sms.gif', WNTFL: 'ntfl.gif', WLANDSLIP: 'landslip.gif',
  WHOT: 'vhot.gif', WCOLD: 'cold.gif', WFROST: 'frost.gif',
  WTMW: 'tsunami-warn.gif', TC1: 'tc1.gif', TC3: 'tc3.gif',
  TC8SW: 'tc8sw.gif', TC8NW: 'tc8nw.gif', TC8SE: 'tc8se.gif',
  TC8NE: 'tc8ne.gif', TC9: 'tc9.gif', TC10: 'tc10.gif'
};

const fallbackNames = {
  WRAINR: '黃色暴雨警告信號', WRAINA: '紅色暴雨警告信號', WRAINB: '黑色暴雨警告信號',
  WFIREY: '黃色火災危險警告', WFIRER: '紅色火災危險警告', WTS: '雷暴警告',
  WMSGNL: '強烈季候風信號', WNTFL: '新界北部水浸特別報告', WLANDSLIP: '山泥傾瀉警告',
  WHOT: '酷熱天氣警告', WCOLD: '寒冷天氣警告', WFROST: '霜凍警告',
  WTMW: '海嘯警告', TC1: '一號戒備信號', TC3: '三號強風信號',
  TC8SW: '八號西南烈風或暴風信號', TC8NW: '八號西北烈風或暴風信號',
  TC8SE: '八號東南烈風或暴風信號', TC8NE: '八號東北烈風或暴風信號',
  TC9: '九號烈風或暴風風力增強信號', TC10: '十號颶風信號'
};

//-- 天文台官方 PSR 雨傘圖標的 Base URL
const BASE_PSR_URL = 'https://www.hko.gov.hk/common/images/';

// 直接用天文台中文 API 的 PSR 文字進行直接對應
function getUmbrellaIconName(psrText) {
    if (!psrText) return "PSRLow_50.png";
    
    // 去除前後空格
    const psr = psrText.trim();
    
    switch(psr) {
       case '低':
    return "PSRLow_50.png";
       case '中低':
    return "PSRMediumLow_50.png";
       case '中':
    return "PSRMedium_50.png";
       case 'medium': // 防止 API 有時混入英文的防錯機制
    return "PSRMedium_50.png";
       case '中高':
    return "PSRMediumHigh_50.png";
       case '高':
    return "PSRHigh_50.png";
default:
    return "PSRLow_50.png";
    }
}

// 健全的主題切換設定
function initThemeToggle() {
  const btn = document.getElementById('theme-btn');
  if (!btn) return;
  const saved = localStorage.getItem('data-theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  btn.textContent = saved === 'dark' ? '🌙' : '🔆';
  
  btn.onclick = function() {
    const curr = document.documentElement.getAttribute('data-theme');
    const next = curr === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    btn.textContent = next === 'dark' ? '🌙' : '🔆';
    localStorage.setItem('data-theme', next);
  };
}

// 1. 獲取九日天氣預報
async function fetchNineDayForecast() {
  const div = document.getElementById('w-forecast');
  if (!div) return;
  try {
    const res = await fetch(`${WX_BASE}?dataType=fnd&lang=tc`, { cache: 'no-store' });
    const data = await res.json();
    if (!data || !Array.isArray(data.weatherForecast)) return;

  //-- 擷取最外層的今日海水溫度數據（獨立於 weatherForecast 陣列外）
  const seaTempObj = data.seaTemp;
    if (seaTempObj && seaTempObj.value !== undefined) {
      //const place = seaTempObj.place || '北角'; // 天文台通常在北角錄得
      const value = seaTempObj.value;
      document.getElementById('curr-sea').textContent = `${value}°C`;
    }
  //--  
    const first = data.weatherForecast[0];
    if (first) {
      backupMinTemp = first.forecastMintemp?.value ?? '--';
      backupMaxTemp = first.forecastMaxtemp?.value ?? '--';
    }
    
    div.innerHTML = '';
    data.weatherForecast.forEach(f => {
      const raw = f.forecastDate || '';
      const dateStr = raw.length === 8 ? `${raw.substring(4,6)}/${raw.substring(6,8)}` : raw;
      const card = document.createElement('div');
      card.className = 'forecast-day-card';
      const psrValue = f.PSR || f.psr || '--'; 

  // 2. 透過剛才的 switch 函數計算出對應的 PSR 雨傘圖標名稱與完整連結
 const umbrellaIconName = getUmbrellaIconName(psrValue);
 const fullUmbrellaUrl = `${BASE_PSR_URL}${umbrellaIconName}`;

      card.innerHTML = `
<div style="color:var(--text-muted); font-weight:600;">${dateStr}</div>
<div class="fc-week" >${f.week || ''}</div>
<img class="fc-icon" src="${ICON_BASE}${f.ForecastIcon}.png" alt="icon">
<div class="fc-temp">${f.forecastMintemp?.value ?? '--'}-${f.forecastMaxtemp?.value ?? '--'}°C</div>
<div class="fc-humi">${f.forecastMinrh?.value ?? '--'}-${f.forecastMaxrh?.value ?? '--'}%</div>
<div class="fc-psr-container"><img class="fc-psr-img" src="${fullUmbrellaUrl}" ><span class="fc-psr-text">${psrValue}</span></div>
      `;
      div.appendChild(card);
    });
  } catch (e) { console.error('預報讀取異常:', e); }
}

// 3. 獲取並渲染天氣警告 (Warnsum)
async function fetchWarningBanner() {
  const div = document.getElementById('w-warnsum');
  if (!div) return;
  try {
    const res = await fetch(`${WX_BASE}?dataType=warnsum&lang=tc`, { cache: 'no-store' });
    const data = await res.json();
    if (!data || Object.keys(data).length === 0) { div.innerHTML = ''; return; } //<div style="color:var(--text-muted); font-style:italic">目前沒有生效警告</div>'; return; }
    
    div.innerHTML = '';
    Object.entries(data).forEach(([key, w]) => {
      if (w.actionCode === 'CANCEL') return;
      
      let matchedCode = null;
      if (iconMap[key]) matchedCode = key;
      else if (w.code && iconMap[w.code]) matchedCode = w.code;
      
      if (!matchedCode) return;
      
      const desc = w.name || fallbackNames[matchedCode] || '天氣警告';
      
      const item = document.createElement('div');
      item.className = 'warning-inline-item';
      item.innerHTML = `<img class="warning-icon" src="${WARN_ICON_BASE}${iconMap[matchedCode]}" alt=${desc} title=${desc}>`;
      div.appendChild(item);
    });
    if (div.children.length === 0) div.innerHTML = ''; //<div style="color:var(--text-muted);">目前沒有生效警告</div>';
  } catch (e) { console.error(e); }
}

// 4. 獲取特別天氣提示 (SWT) 並動態嵌入警告卡片內部（已修正語法，絕不遺漏內容）
async function fetchSpecialWeatherTips() {
  const swtDiv = document.getElementById('w-swt');
  if (!swtDiv) return;
  try {
    const url = `${WX_BASE}?dataType=swt&lang=tc`;
    const res = await fetch(url, { cache: 'no-store' });
    const data = await res.json();
    
    if (data && Array.isArray(data.swt) && data.swt.length > 0) {
      let tipsHTML = '<div class="swt-title" style="margin-top: 0px; padding-top: 0px; border-top: 1px dashed var(--border-color); font-weight: 700; color: var(--swt-text);">📢 特別天氣提示 :</div>';
      data.swt.forEach(tip => { 
if (tip.desc) tipsHTML += `<div style="font-size: 0.9rem; line-height: 1.5; margin-top: 4px; color: var(--text-sub);">${tip.desc}</div>`; 
      });
      swtDiv.innerHTML = tipsHTML;
      swtDiv.style.display = 'block'; 
    } else {
      swtDiv.style.display = 'none'; 
    }
  } catch (error) {
    swtDiv.style.display = 'none';
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  initThemeToggle();
  window.Weather = {
    fetchCurrent: fetchCurrentWeather(),
    fetchForecast: fetchNineDayForecast(),
    refresh: async function() {
      await Promise.all([
        fetchCurrentWeather(),
        fetchNineDayForecast(),
        fetchWarningBanner(),
        fetchSpecialWeatherTips()
    ]);
  }
};

    window.Weather.refresh();

  // 每 5 分鐘（300000 毫秒）更新一次天氣與預報
  setInterval(() => {
    fetchCurrentWeather();
    fetchNineDayForecast();
  }, 5 * 60 * 1000);

  // 每 1 分鐘（60000 毫秒）更新一次警告與特別提示
  setInterval(() => {
    fetchWarningBanner();
    fetchSpecialWeatherTips();
  }, 1 * 60 * 1000);
});      
</script>
